name: Validate HP Framework Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package structure
        shell: pwsh
        run: ./.github/scripts/Validate-Package.ps1

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $package = Get-Content ./package.json -Raw | ConvertFrom-Json
          $expected = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$expected'."
          }
          Write-Host "Release version verified: $expected"